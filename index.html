<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartelitos Buffet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header no-print">
  <h1>Cartelitos del Buffet</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="platos">Platos</button>
    <button class="tab-btn" data-tab="cartelitos">Cartelitos <span id="contador-seleccion" class="badge">0</span></button>
  </nav>
</header>

<div id="aviso-config" class="aviso no-print" hidden>
  ⚠️ Falta configurar la URL de Apps Script en <code>js/config.js</code> (variable <code>SHEET_WEBAPP_URL</code>).
</div>

<main>

  <!-- ================= PESTAÑA: PLATOS ================= -->
  <section id="tab-platos" class="tab-panel active">

    <div class="toolbar no-print">
      <input type="search" id="buscador" placeholder="Buscar plato...">
      <button id="btn-recargar" class="btn secundario">Recargar de la hoja</button>
      <button id="btn-limpiar-seleccion" class="btn secundario">Vaciar selección de hoy</button>
    </div>

    <div id="estado-carga" class="estado">Cargando platos...</div>

    <div id="categorias-container"></div>

  </section>

  <!-- ================= PESTAÑA: CARTELITOS ================= -->
  <section id="tab-cartelitos" class="tab-panel">

    <div class="toolbar no-print">
      <button id="btn-imprimir" class="btn principal">🖨️ Imprimir / Guardar PDF</button>
      <span id="cartelitos-vacio-msg" class="estado" hidden>Aún no has seleccionado ningún plato en la pestaña "Platos".</span>
    </div>

    <div id="cartelitos-grid" class="cartelitos-grid"></div>

  </section>

</main>

<!-- ================= PLANTILLA: tarjeta de plato con checkbox ================= -->
<template id="tpl-plato-item">
  <label class="plato-item">
    <input type="checkbox" class="plato-checkbox">
    <span class="plato-nombres">
      <span class="plato-es"></span>
      <span class="plato-en"></span>
    </span>
  </label>
</template>

<!-- ================= PLANTILLA: cartelito impreso ================= -->
<template id="tpl-cartelito">
  <div class="cartelito">
    <div class="cartelito-es"></div>
    <div class="cartelito-en"></div>
  </div>
</template>

<!-- ================= MODAL: añadir plato nuevo ================= -->
<div id="modal-nuevo-plato" class="modal no-print" hidden>
  <div class="modal-contenido">
    <h2>Añadir plato nuevo</h2>
    <form id="form-nuevo-plato">
      <label>Categoría
        <select id="nuevo-categoria" required></select>
      </label>
      <label>Nombre en español
        <input type="text" id="nuevo-nombre-es" required placeholder="Ej. Ensalada de tomate">
      </label>
      <label>Nombre en inglés <span class="opcional">(opcional, se traduce automáticamente si lo dejas vacío)</span>
        <input type="text" id="nuevo-nombre-en" placeholder="Ej. Tomato salad">
      </label>
      <label>PIN
        <input type="password" id="nuevo-pin" inputmode="numeric" placeholder="PIN de administración">
      </label>
      <div id="form-nuevo-plato-error" class="form-error" hidden></div>
      <div class="modal-botones">
        <button type="button" id="btn-cancelar-nuevo" class="btn secundario">Cancelar</button>
        <button type="submit" id="btn-guardar-nuevo" class="btn principal">Guardar plato</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
